name: Docs

# Builds the VitePress site and publishes it to GitHub Pages.
#
# One-time setup, in the repository settings:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# or:
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'course/stages/**'      # the site reads these; a change must redeploy
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # so "last updated" timestamps are real

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci || npm install

      - name: Build
        working-directory: docs
        run: npx vitepress build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
